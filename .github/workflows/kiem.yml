# Cổng kiểm tự động — chạy đúng những gì người ta vẫn chạy tay trước khi push.
# Trước 04/09/2026 repo không có CI nào: mọi lần "tsc sạch, e2e xanh" đều là lời
# kể của người đẩy commit. Nay máy nói.
name: Kiểm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web — kiểu dữ liệu + dựng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Mọi bước dưới đây gọi script trong package.json, không gõ lệnh riêng:
      # CI và người phải chạy ĐÚNG một câu lệnh, không thì "máy xanh, máy tao
      # đỏ" và không ai biết bên nào đúng.
      - name: Kiểu dữ liệu
        run: bun run kieu
      - name: Dựng
        # Build không có key Supabase vẫn phải qua: trang động rơi về rỗng,
        # nhưng lỗi cú pháp / import / kiểu thì lộ ra ngay.
        run: bun run build

  bot:
    name: Bot — e2e hội thoại
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Không cần `setup-node`: ubuntu-latest có sẵn Node, và bốn file test là
      # .mjs trần không import gói nào — thêm bước chỉ tốn 4 s tải Node 20 và
      # kéo theo cảnh báo deprecation.
      #
      # Suite e2e có package.json RIÊNG (`@anthropic-ai/sdk`, `zod`) và
      # node_modules của nó nằm trong .gitignore — cài ở gốc repo là không đủ.
      - name: Cài phụ thuộc của suite e2e
        run: bun install --frozen-lockfile --cwd bot/tests/e2e
      # `chay.sh` TỰ dựng lại bundle từ nguồn rồi mới chạy 208 ca (run.mjs 160 +
      # webhook.mjs 44 + cong-thieu-bi-mat.mjs 4, ba tiến trình) — đừng
      # đổi thành `node run.mjs`, nó sẽ test bản bundle cũ nằm sẵn trong repo.
      # Supabase và model đều là bản giả lập trong `mock-*.mjs`: không đụng DB
      # thật, không tốn tiền model, không cần secret nào trong CI.
      #
      # `test:bot` kéo theo cả `ranh-gioi.mjs` — kiểm tĩnh ranh giới bóc tách ⟂
      # AI (mã tiền định không được chạm model/DB; tầng AI không được ghi bảng
      # nghiệp vụ). Để chung job cố ý: danh sách required status checks ở
      # docs/11 §11.5 giữ nguyên 6 tên, thêm check mới là phải sửa branch
      # protection bằng tay và người ta sẽ quên.
      - name: e2e + hồi quy FR-159/161/164 + ranh giới bóc tách ⟂ AI
        run: bun run test:bot

  baomat:
    name: Bảo mật — hồi quy RLS trên DB thật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Bắn anon key CÔNG KHAI (đã nằm trong lib/supabase.ts và mọi bundle web
      # đã phát hành) vào DB thật — không cần secret nào, và đó chính là điểm:
      # thứ phải chịu được là cái key mà ai cũng có. Chỉ các bài KHÔNG phá huỷ;
      # bài xoá dữ liệu vẫn ở bộ chạy tay (docs/10 §10.7).
      #
      # Job này KHÔNG nằm trong `bun run kiem` vì nó cần đường ra Internet tới
      # supabase.co — máy dev hoặc sandbox không có là `kiem` đỏ oan. Bù lại
      # `test:bot` có bài tự kiểm chạy offline, chứng minh bộ này không thể
      # báo xanh khi mất mạng (thoát 2 = "chưa kiểm được", khác 0 = "đạt").
      - name: TS-SEC — anon không đọc/ghi được gì nội bộ, mặt công khai còn sống
        run: bun run test:sec

  truyvet:
    name: Tài liệu — truy vết ID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Gọi script trong package.json chứ KHÔNG gõ `bash scripts/…` thẳng: hai
      # chỗ ghi đường dẫn là hai chỗ trôi được. Không `bun install`: script là
      # bash trần, không đụng node_modules.
      - name: Không có ID gãy, số đếm khớp README, không rò PII
        run: bun run truyvet

  # Sao lưu là loại mã chỉ được kiểm đúng một lần trong đời — hôm mất dữ liệu.
  # Job này bơm năm cách hỏng đã biết (bảng mới chưa khai, một bảng lỗi, DB trả
  # thiếu dòng, không đọc được số dòng, xuất schema hụt) vào một PostgREST giả
  # rồi soi mã thoát + manifest. Không chạm DB thật, không cần khoá.
  saoluu:
    name: Sao lưu — tự kiểm trên PostgREST giả
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Script phân biệt được 'đủ' với 'trông như đủ'
        run: bun run test:saoluu
      # Cùng job, không thêm check mới: danh sách required status checks ở
      # docs/11 §11.5 giữ nguyên 6 tên. Bản xuất rổ hàng cũng ghi file ra đĩa
      # và cũng có thể lỡ ghi vào repo (SĐT thật → repo public), nên cùng loại
      # rủi ro, cùng chỗ canh.
      - name: Bản xuất rổ hàng không ghi vào repo, không nuốt dòng thiếu
        run: bun run test:rohang
      # Cùng job, cùng lý do: `up-masterdb.mjs` đẩy bản gốc lên bucket, và cái
      # phải chứng minh không phải "đẩy được" mà là "biết khi nào mình đẩy hụt"
      # — bucket trả 200 mà không cất thì vòng lặp vẫn báo xong.
      - name: Đẩy masterDB biết khi nào mình đẩy hụt
        run: bun run test:masterdb

  # Một bản sao chưa từng phục hồi thử KHÔNG PHẢI là bản sao. Job này chạy diễn
  # tập thật: dựng schema, nạp một bản sao giả, rồi bơm 9 cách hỏng đã biết vào
  # và soi mã thoát — chứng minh bộ soát phân biệt được "phục hồi được" với
  # "trông như phục hồi được". Dùng Postgres thật trong service container, không
  # chạm production, không cần khoá nào.
  phuchoi:
    name: Phục hồi — diễn tập trên Postgres thật
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `psql` là client, không phải server — cần riêng, service container ở
      # trên chỉ cho cái server.
      - name: Cài psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bộ soát phục hồi phải bắt được cả 9 cách hỏng
        run: bun run test:phuchoi

  # ── CỔNG THỨ 7: REPO ↔ DB CÓ CÙNG DANH SÁCH MIGRATION KHÔNG ────────────────
  # Chủ dự án 10/09/2026: "thêm một cổng CI so danh sách migration trên database
  # với thư mục trong repo. Cổng này lẽ ra đã chặn được cả năm báo động giả
  # hôm nay."
  #
  # Chuyện xảy ra hôm đó: hai lượt soát code đọc bản chụp `schema.sql` ở hai mốc
  # thời gian khác nhau trong lúc DB đang được vá, rồi kết luận ngược nhau — một
  # bên báo 5 lỗ, một bên báo 5 báo động giả. Không ai sai; cái thiếu là một chỗ
  # NÓI RA rằng repo đang tụt lại sau DB.
  #
  # Không cần secret: gọi `liet_ke_migration_cong_khai()` (20260910o) bằng đúng
  # khoá công khai đã nằm trong mọi bundle web, và hàm đó chỉ trả version + name
  # — không bao giờ trả nội dung DDL. Nhét service_role vào CI của repo PUBLIC
  # là mở toang, một cổng chống trôi schema không đáng đổi bằng cái đó.
  migration:
    name: Migration — repo và DB cùng một danh sách
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Mọi migration đã áp đều có file, mọi file đều đã áp, ảnh chụp không cũ hơn
        run: bun run soat:migration

  # ── CỔNG THỨ 8: TRẠNG THÁI DB CÓ GÌ MỚI KHÔNG ──────────────────────────────
  # Tầng một (cổng 7) hỏi "repo và DB có cùng DANH SÁCH migration không". Cổng
  # này hỏi câu khác: DB đang ở TRẠNG THÁI nào — vì cả năm lỗi nặng ngày 10/09
  # đều KHÔNG nhìn thấy được từ danh sách migration, chúng nằm trong catalog
  # (policy chặn khoá không tồn tại · view mất security_invoker · hàm hai chữ ký
  # · bảng mất khoá chính).
  #
  # Tám phép soát chạy TRONG DB qua `soat_db_cong_khai()` (20260910p): dưới một
  # giây, chỉ `select`, không ghi gì, và chỉ trả KẾT LUẬN — Zalo ID che còn 4 số
  # cuối, không có nội dung tin nhắn. Không cần secret, cùng lý do với cổng 7.
  #
  # Cổng đỏ khi có phát hiện KHÁC bản nền `scripts/soat-db-da-biet.json`. Nền có
  # là vì cổng đỏ ngay từ ngày đầu là cổng sẽ bị bỏ qua — đúng bài học 52 dòng
  # cảnh báo kêu mãi rồi cái thứ 53 chìm lẫn vào đó.
  soatdb:
    name: DB — tám phép soát trạng thái
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Không có phát hiện mới so với bản nền đã biết
        run: bun run soat:db
